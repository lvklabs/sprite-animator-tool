name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Tag releases should always complete; never cancel a release run in flight.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runner must be ubuntu-latest (currently 24.04), not 22.04:
          # CMakeLists.txt requires Qt6 6.4+ (find_package(Qt6 6.4 REQUIRED ...))
          # but apt on Ubuntu 22.04 ships Qt 6.2.4, so configure hard-fails and
          # the Linux release artifact never publishes. 24.04's apt ships
          # 6.4.2, which satisfies the requirement and matches build.yml.
          - os: ubuntu-latest
            preset: linux
          - os: macos-latest
            preset: macos
          # Windows is currently disabled in release. The build fails with
          # "ninja: error: multiple rules generate
          # tests/unit/src/ui_mainwindow.h" because every test executable
          # has CMAKE_AUTOUIC=ON and includes the shared src/mainwindow.ui,
          # so Ninja sees duplicate rules. See build.yml for full context.
          # Re-enable once the .ui-consuming code is factored into a shared
          # CMake INTERFACE library.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 via apt (Linux)
        # Mirror build.yml: aqtinstall pulls Qt binaries linked against a
        # libicu version Ubuntu doesn't ship (so.73 for Qt 6.8.0), so uic
        # exits before the build can run. apt's qt6-base-dev is compiled
        # against system ICU and works directly. See build.yml for the
        # full rationale; this lane is the release equivalent.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libqt6widgets6 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            xvfb

      - name: Install Qt 6.8.0
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          aqtversion: '==3.1.*'
          cache: true
          archives: 'qtbase qtsvg qtimageformats'

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }} -j

      - name: Smoke (binary runs --help) (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./build/LvkSpriteEditor --help

      - name: Smoke (binary runs --help) (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/LvkSpriteEditor.app/Contents/MacOS/LvkSpriteEditor --help

      - name: Package
        working-directory: build
        run: cpack

      - name: List packages
        run: ls -la build/

      - name: Install + smoke DEB (Linux)
        # Mirror build.yml's verification: a tag-time CPack regression that
        # produces a broken DEB must fail the release run, not ship to users.
        # Install the freshly-built .deb and re-run --help against the
        # system-installed binary to prove the package is usable.
        if: runner.os == 'Linux'
        env:
          # The installed binary is launched headless; without this it
          # tries to load the xcb plugin and aborts (no DISPLAY).
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ls -la *.deb
          sudo apt-get install -y --no-install-recommends ./lvksprite*.deb \
            || sudo dpkg -i ./lvksprite*.deb \
            || sudo apt-get install -y --no-install-recommends ./LvkSpriteEditor*.deb \
            || sudo dpkg -i ./LvkSpriteEditor*.deb
          which LvkSpriteEditor
          LvkSpriteEditor --help

      - name: Upload to GitHub Release (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.tar.gz
          # Fail the workflow if any expected glob matches zero files: an
          # empty release on Linux means cpack silently broke and we'd be
          # shipping a tag with no artifacts. CPack generators here are
          # DEB+TGZ, so both globs must produce at least one file.
          fail_on_unmatched_files: true

      - name: Upload to GitHub Release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
          # See Linux notes; on macOS CPack runs DragNDrop, so a .dmg must
          # exist or this release run was a no-op and the tag is empty.
          fail_on_unmatched_files: true
