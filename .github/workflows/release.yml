name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Tag releases should always complete; never cancel a release run in flight.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runner must be ubuntu-latest (currently 24.04), not 22.04:
          # CMakeLists.txt requires Qt6 6.4+ (find_package(Qt6 6.4 REQUIRED ...))
          # but apt on Ubuntu 22.04 ships Qt 6.2.4, so configure hard-fails and
          # the Linux release artifact never publishes. 24.04's apt ships
          # 6.4.2, which satisfies the requirement and matches build.yml.
          - os: ubuntu-latest
            preset: linux
          - os: macos-latest
            preset: macos
          # Windows stays disabled in RELEASE for now. The Ninja
          # duplicate-AUTOUIC blocker is fixed (see build.yml, whose
          # Windows lane is re-enabled), but the NSIS packaging path has
          # never run in CI; promote Windows here only after build.yml
          # is proven green on windows-latest and the cpack NSIS output
          # has been smoke-tested.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches PROJECT_VERSION
        # A tag like v2.0.1 must match the version CMake stamps into the
        # artifacts (project(... VERSION x.y.z) in CMakeLists.txt).
        # Without this check a mis-tagged push publishes artifacts whose
        # embedded version, package filename, and release tag disagree.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # project() spans multiple lines in CMakeLists.txt; match the
          # indented "VERSION x.y.z" line inside it.
          cmake_version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          echo "tag: $tag_version / CMakeLists.txt: $cmake_version"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project VERSION $cmake_version"
            exit 1
          fi

      - name: Install Qt6 via apt (Linux)
        # Mirror build.yml: aqtinstall pulls Qt binaries linked against a
        # libicu version Ubuntu doesn't ship (so.73 for Qt 6.8.0), so uic
        # exits before the build can run. apt's qt6-base-dev is compiled
        # against system ICU and works directly. See build.yml for the
        # full rationale; this lane is the release equivalent.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libqt6widgets6 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            xvfb

      - name: Install Qt 6.8.0
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          aqtversion: '==3.1.*'
          cache: true
          # qttools provides lrelease/LinguistTools (translation catalogs
          # are gated on Qt6LinguistTools_FOUND) and macdeployqt for the
          # bundle step below.
          archives: 'qtbase qtsvg qtimageformats qttools'

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        # -j 2 (not -j): mirror build.yml -- an unbounded -j on the same
        # 7 GB hosted runner OOM-kills cc1plus under AUTOMOC/AUTOUIC
        # memory spikes, and a flaky release lane is worse than a slow one.
        run: cmake --build --preset=${{ matrix.preset }} -j 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (binary runs --help) (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./build/LvkSpriteEditor --help

      - name: Smoke (binary runs --help) (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/LvkSpriteEditor.app/Contents/MacOS/LvkSpriteEditor --help

      - name: Bundle Qt frameworks into the .app (macOS)
        # Without macdeployqt the DragNDrop DMG ships a non-relocatable
        # .app that only launches on machines with a matching Qt install
        # at the build-time prefix. macdeployqt copies the Qt frameworks
        # + platform plugins into the bundle and rewrites the load paths.
        if: runner.os == 'macOS'
        run: macdeployqt build/LvkSpriteEditor.app -verbose=1

      - name: Package
        working-directory: build
        run: cpack

      - name: List packages
        run: ls -la build/

      - name: Install + smoke DEB (Linux)
        # Mirror build.yml's verification: a tag-time CPack regression that
        # produces a broken DEB must fail the release run, not ship to users.
        # Install the freshly-built .deb and re-run --help against the
        # system-installed binary to prove the package is usable.
        if: runner.os == 'Linux'
        env:
          # The installed binary is launched headless; without this it
          # tries to load the xcb plugin and aborts (no DISPLAY).
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          ls -la *.deb
          # CPACK_PACKAGE_FILE_NAME is LvkSpriteEditor-<version>-Linux-*;
          # see build.yml -- the old lvksprite* globs never matched.
          sudo apt-get install -y --no-install-recommends ./LvkSpriteEditor*.deb
          which LvkSpriteEditor
          LvkSpriteEditor --help

      - name: Upload to GitHub Release (Linux)
        # Guard on a tag ref: action-gh-release hard-fails without one, so
        # a workflow_dispatch run (useful as a packaging dry-run) would
        # otherwise be guaranteed to end red at this step.
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.tar.gz
          # Fail the workflow if any expected glob matches zero files: an
          # empty release on Linux means cpack silently broke and we'd be
          # shipping a tag with no artifacts. CPack generators here are
          # DEB+TGZ, so both globs must produce at least one file.
          fail_on_unmatched_files: true

      - name: Upload to GitHub Release (macOS)
        # See the Linux upload step: tag-guarded so workflow_dispatch
        # works as a packaging dry-run.
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
          # See Linux notes; on macOS CPack runs DragNDrop, so a .dmg must
          # exist or this release run was a no-op and the tag is empty.
          fail_on_unmatched_files: true
