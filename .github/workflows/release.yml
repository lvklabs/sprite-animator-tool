name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux
          - os: macos-latest
            preset: macos
          # Windows is currently disabled in release. The build fails with
          # "ninja: error: multiple rules generate
          # tests/unit/src/ui_mainwindow.h" because every test executable
          # has CMAKE_AUTOUIC=ON and includes the shared src/mainwindow.ui,
          # so Ninja sees duplicate rules. See build.yml for full context.
          # Re-enable once the .ui-consuming code is factored into a shared
          # CMake INTERFACE library.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 via apt (Linux)
        # Mirror build.yml: aqtinstall pulls Qt binaries linked against a
        # libicu version Ubuntu doesn't ship (so.73 for Qt 6.8.0), so uic
        # exits before the build can run. apt's qt6-base-dev is compiled
        # against system ICU and works directly. See build.yml for the
        # full rationale; this lane is the release equivalent.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libqt6widgets6 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            xvfb

      - name: Install Qt 6.8.0
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          aqtversion: '==3.1.*'
          cache: true
          archives: 'qtbase qtsvg qtimageformats'

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }} -j

      - name: Smoke (binary runs --help) (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./build/LvkSpriteEditor --help

      - name: Smoke (binary runs --help) (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/LvkSpriteEditor.app/Contents/MacOS/LvkSpriteEditor --help

      - name: Package
        working-directory: build
        run: cpack

      - name: List packages
        run: ls -la build/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.tar.gz
            build/*.dmg
            build/*.exe
            build/*.zip
          fail_on_unmatched_files: false
