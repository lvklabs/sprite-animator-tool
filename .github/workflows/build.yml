name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: apt-installed system Qt (currently 6.4.2 on the runner).
          # Do NOT label this lane with a specific Qt version: the apt step
          # below ignores matrix.qt-version entirely (aqtinstall's Qt links
          # against a libicu Ubuntu doesn't ship, so we use the distro's
          # qt6-base-dev). The label was previously '6.5.3' which lied
          # about the build's actual Qt version.
          - os: ubuntu-latest
            qt-version: 'system'
            preset: linux
          - os: macos-latest
            qt-version: '6.5.3'
            preset: macos
          - os: macos-latest
            qt-version: '6.8.0'
            preset: macos
          # Windows lane re-enabled (Round 8): the "multiple rules
          # generate tests/unit/src/ui_mainwindow.h" Ninja failure was
          # caused by every full test target listing the out-of-tree
          # src/mainwindow.ui as an explicit source, which made CMake
          # emit the uic output at a path shared across targets. The
          # tests now rely on AUTOUIC_SEARCH_PATHS discovery, which
          # generates per-target headers (verified with -G Ninja on
          # Linux: clean build, 35/35 tests).
          - os: windows-latest
            qt-version: '6.8.0'
            preset: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 via apt (Linux)
        # aqtinstall pulls Qt binaries linked against the libicu version
        # current at the Qt build's time (so.56 for Qt 6.5.3, so.73 for
        # 6.8.0). Ubuntu 24.04 ships libicu74 only, so uic exits before
        # the build can run. apt's qt6-base-dev/qt6-tools-dev are
        # compiled against the system ICU, so they work directly. We
        # ignore matrix.qt-version on Linux and use apt's package
        # (currently Qt 6.4.2 on Ubuntu 24.04).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libqt6widgets6 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3 \
            xvfb

      - name: Install Qt ${{ matrix.qt-version }}
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          aqtversion: '==3.1.*'
          cache: true
          # qttools provides lrelease/LinguistTools: without it the
          # macOS lanes silently skip embedding the translation catalogs
          # (CMake gates i18n on Qt6LinguistTools_FOUND), diverging from
          # what the Linux lane builds. qtimageformats matches
          # release.yml so CI exercises the same decoder set we ship.
          archives: 'qtbase qtsvg qtimageformats qttools'

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CMake preset)
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        # -j 2 (not -j) to cap memory under the 7 GB hosted-runner limit;
        # AUTOMOC/AUTOUIC compilations balloon RSS and a default
        # `cmake --build -j` (all 4 cores) OOM-kills cc1plus.
        run: cmake --build --preset=${{ matrix.preset }} -j 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (binary runs --help) (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a ./build/LvkSpriteEditor --help

      - name: Smoke (headless export) (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a ./build/LvkSpriteEditor --export examples/mario.lvks
          ls -la examples/
          # Accept any cocos2d export artifact next to the input .lvks.
          test -f examples/mario.lkob -o -f examples/mario.png -o -f examples/mario.plist

      - name: Smoke (binary runs --help) (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        # MACOSX_BUNDLE TRUE puts the binary inside an .app bundle.
        run: ./build/LvkSpriteEditor.app/Contents/MacOS/LvkSpriteEditor --help

      - name: Smoke (binary runs --help) (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # The windows preset uses single-config Ninja (see
        # CMakePresets.json), so the binary lands directly in build\,
        # not in a per-config Release\ subdirectory.
        run: build\LvkSpriteEditor.exe --help

      - name: Upload binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-linux-qt${{ matrix.qt-version }}
          path: build/**/LvkSpriteEditor
          if-no-files-found: error

      - name: Upload binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-macos-qt${{ matrix.qt-version }}
          path: |
            build/**/LvkSpriteEditor
            build/**/LvkSpriteEditor.app
          if-no-files-found: error

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-windows-qt${{ matrix.qt-version }}
          path: build/**/LvkSpriteEditor*.exe
          if-no-files-found: error

      - name: cpack DEB + install (Linux)
        if: runner.os == 'Linux'
        env:
          # The installed binary is launched headless; without this it
          # tries to load the xcb plugin and aborts (no DISPLAY).
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build && cpack -G DEB
          ls -la *.deb
          # CPACK_PACKAGE_FILE_NAME is LvkSpriteEditor-<version>-Linux-*;
          # the previous lvksprite* globs never matched and the four-way
          # || fallback chain obscured which install path actually ran.
          sudo apt-get install -y --no-install-recommends ./LvkSpriteEditor*.deb
          which LvkSpriteEditor
          LvkSpriteEditor --help

  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Run clang-format --dry-run --Werror on src/
        run: |
          find src -name '*.cpp' -o -name '*.h' | xargs clang-format-18 --dry-run --Werror

  tidy-check:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 via apt + clang-tidy
        # Use the same apt Qt6 as the Linux matrix entry above; aqtinstall
        # Qt 6.8.0 here would make tidy analyze headers the build doesn't
        # use, so diagnostics could fire on APIs the actual build sees
        # under apt's Qt 6.4.2 (or vice versa).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            libqt6widgets6 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            clang-tidy-18

      - name: Configure (export compile_commands.json)
        run: cmake --preset=linux

      # clang-tidy consumes compile_commands.json entries whose include
      # paths point at AUTOUIC/AUTOMOC output (ui_mainwindow.h lives in
      # <target>_autogen/include). Those headers only exist after the
      # autogen targets run, and src/mainwindow.cpp is compiled by many
      # targets (app + GUI tests), so ALL autogen targets must be built
      # or tidy fails with "'ui_mainwindow.h' file not found". Building
      # just the autogen targets takes seconds (moc/uic only, no C++).
      - name: Generate AUTOMOC/AUTOUIC headers
        run: |
          targets=$(cmake --build build --target help \
            | sed -n 's/^\.\.\. \(.*_autogen\)$/\1/p' | grep -v timestamp)
          cmake --build build -j 2 --target $targets

      # AUTOMOC-generated sources live under build/ and don't need to be
      # tidied. We restrict the scan to src/*.cpp under tracking.
      #
      # The CLI does NOT pass --warnings-as-errors='*' (which would
      # override the .clang-tidy WarningsAsErrors setting and gate CI on
      # every modernize-*, readability-*, bugprone-* diagnostic). The
      # codebase is legacy-derived and floods on the broad check list;
      # see .clang-tidy for the narrow set of checks promoted to
      # gating errors via WarningsAsErrors. Everything else is logged
      # advisory.
      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' | xargs clang-tidy-18 -p build
