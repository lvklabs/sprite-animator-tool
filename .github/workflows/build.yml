name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        qt-version: ['6.5.3', '6.8.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt6 runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          aqtversion: '==3.1.*'
          cache: true
          modules: 'qttools'
          archives: 'qtbase qtsvg'

      - name: Configure (CMake preset)
        run: cmake --preset=default

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-linux-qt${{ matrix.qt-version }}
          path: build/LvkSpriteEditor
          if-no-files-found: warn

      - name: Upload binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-macos-qt${{ matrix.qt-version }}
          path: |
            build/LvkSpriteEditor
            build/LvkSpriteEditor.app
          if-no-files-found: warn

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LvkSpriteEditor-windows-qt${{ matrix.qt-version }}
          path: build/LvkSpriteEditor.exe
          if-no-files-found: warn

  format-check:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format --dry-run --Werror on src/
        run: |
          shopt -s nullglob
          files=(src/*.cpp src/*.h)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No src/*.{cpp,h} files found; skipping."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
